# Déploiement automatique, déclenché uniquement par les push :
#
#   push sur main (direct, ou merge d'une PR)
#     → GitHub Actions construit le site (vite build) et pousse le contenu
#       de dist/ — prêt à servir — sur la branche `deploy`
#     → puis appelle le webhook https://christophefleury.fr/deploy-roadtrip.php
#       (jeton du secret DEPLOY_TOKEN, envoyé en en-tête X-Deploy-Token) ;
#       ce PHP fait le git pull (fetch + reset) du clone du serveur.
#       En dehors des push, rien ne tourne nulle part.
#
# Pourquoi un webhook plutôt qu'un SSH depuis Actions : le pare-feu
# o2switch bloque le SSH venant des IP non françaises, dont les runners
# GitHub. Le HTTPS vers le site, lui, passe normalement.
#
# Le serveur n'a besoin que de git : ni Node, ni npm, ni build sur place.
#
# Mise en place côté serveur (une seule fois, déjà faite) :
#   git clone --branch deploy --single-branch \
#     https://github.com/christophefleurypro/all-road-trip.git ~/christophefleury.fr/roadtrip
#   + le fichier ~/christophefleury.fr/deploy-roadtrip.php (webhook)

name: Build & déploiement

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions, pour relancer à la main

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # nécessaire pour pousser la branche deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # La branche deploy ne porte qu'un seul commit, réécrit à chaque build :
      # pas d'historique de builds à faire grossir dans le dépôt.
      - name: Publier dist/ sur la branche deploy
        run: |
          cd dist
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA:0:7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy

      # DIAGNOSTIC TEMPORAIRE — le webhook renvoie 520 depuis les runners ;
      # on localise le blocage (Cloudflare ou origine o2switch) puis on
      # restaurera l'appel réel.
      - name: Prévenir le serveur (déclenche son git pull)
        run: |
          t() { printf "%-52s" "$1"; shift; curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 "$@" || echo "ECHEC RESEAU"; }
          t "1. / via Cloudflare"            https://christophefleury.fr/
          t "2. /roadtrip/ via Cloudflare"   https://christophefleury.fr/roadtrip/
          t "3. webhook sans jeton via CF"   https://christophefleury.fr/deploy-roadtrip.php
          t "4. / direct origine"            --resolve christophefleury.fr:443:109.234.166.207 https://christophefleury.fr/
          t "5. webhook sans jeton origine"  --resolve christophefleury.fr:443:109.234.166.207 https://christophefleury.fr/deploy-roadtrip.php
          echo "== certificat servi par l'origine =="
          curl -sv --max-time 20 --resolve christophefleury.fr:443:109.234.166.207 https://christophefleury.fr/ -o /dev/null 2>&1 | grep -iE "subject:|issuer:|SSL certificate" || true
