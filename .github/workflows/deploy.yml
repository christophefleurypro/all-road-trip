# Déploiement automatique :
#
#   push sur main
#     → GitHub Actions construit le site (vite build) et pousse le contenu
#       de dist/ — prêt à servir — sur la branche `deploy`
#     → sur le serveur (o2switch), un cron tire la branche toutes les
#       2 minutes : ~/bin/deploy-roadtrip.sh fait git fetch + reset --hard
#       s'il y a du nouveau. Le site est donc à jour au plus 2 min après
#       la fin du build.
#
# Pourquoi un cron côté serveur plutôt qu'un SSH depuis Actions : le
# pare-feu o2switch bloque le SSH venant des IP non françaises, dont les
# runners GitHub (connection timed out systématique).
#
# Le serveur n'a besoin que de git : ni Node, ni npm, ni build sur place.
# Aucun secret n'est nécessaire.
#
# Mise en place côté serveur (une seule fois, déjà faite) :
#   git clone --branch deploy --single-branch \
#     https://github.com/christophefleurypro/all-road-trip.git ~/christophefleury.fr/roadtrip
#   + le script ~/bin/deploy-roadtrip.sh appelé par la crontab (*/2)

name: Build & déploiement

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions, pour relancer à la main

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # nécessaire pour pousser la branche deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # La branche deploy ne porte qu'un seul commit, réécrit à chaque build :
      # pas d'historique de builds à faire grossir dans le dépôt.
      - name: Publier dist/ sur la branche deploy
        run: |
          cd dist
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA:0:7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy
